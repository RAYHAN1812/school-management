name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms_dev_password
          POSTGRES_DB: sms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sms -d sms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sms:sms_dev_password@localhost:5432/sms_test?schema=public
      DATABASE_URL: postgresql://sms:sms_dev_password@localhost:5432/sms_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: server
      - name: API tests (221)
        run: npm test
      - name: Client build
        run: npm run build
