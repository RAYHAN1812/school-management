# One-command stack: `docker compose up --build`
#   client  -> http://localhost:8080  (nginx, proxies /api to server)
#   server  -> http://localhost:5000/api
#   db      -> localhost:${POSTGRES_PORT:-5432}
# For local development you usually only need: `docker compose up -d db`

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sms} -d ${POSTGRES_DB:-sms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sms}:${POSTGRES_PASSWORD:-sms_dev_password}@db:5432/${POSTGRES_DB:-sms}?schema=public
      JWT_SECRET: ${JWT_SECRET:-docker-dev-only-secret-change-me-please-123456}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      COOKIE_SECURE: "false"
      RUN_SEED: "true"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "5000:5000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
